name: Calidad
on: [push, pull_request]
jobs:
  web-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Backend (Pages Functions + módulos v1/v2) y pruebas de base de datos.
      - run: npm ci
      - run: npm run typecheck --ignore-scripts || npx tsc --noEmit
      - run: npm test
      - run: npm run quality
      # Bun por script oficial (la política del repo solo permite actions/*).
      - name: Instalar Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      # Web (Next.js 16): dependencias, cliente Prisma y typecheck.
      - working-directory: web
        run: bun install --frozen-lockfile
      - working-directory: web
        run: bun run db:generate
      - working-directory: web
        run: bunx tsc -p tsconfig.json --noEmit
      # Exportación estática para Cloudflare Pages (base /api/v2 inlineada).
      - name: Build estático de la web
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://orqskfecwtroppqimhnj.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: bash scripts/build-static.sh
      # Pruebas HTTP contra el backend local (D1 local + Pages Functions).
      - name: Preparar D1 local (core + 9 shards)
        run: |
          npx wrangler d1 migrations apply D1_CORE --local
          for s in 01 02 03 04 05 06 07 08 09; do
            npx wrangler d1 migrations apply D1_SHARD_$s --local
          done
      - name: Comprobaciones HTTP
        run: |
          npx wrangler pages dev web/out --ip 127.0.0.1 --port 8788 > /tmp/menrut-pages.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8788/api/v1/health > /dev/null 2>&1 && break
            sleep 2
          done
          if ! curl -sf http://127.0.0.1:8788/api/v1/health > /dev/null 2>&1; then
            echo "== El servidor local no respondió; log de pages dev =="
            cat /tmp/menrut-pages.log || true
            exit 1
          fi
          python3 tests/http_test.py
