name: Calidad
on: [push, pull_request]
jobs:
  web-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          VITE_SUPABASE_URL: https://orqskfecwtroppqimhnj.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - run: npx playwright install --with-deps chromium
      - name: Preparar D1 local
        run: |
          npx wrangler d1 migrations apply D1_CORE --local
          npx wrangler d1 migrations apply D1_SHARD_01 --local
          npx wrangler d1 migrations apply D1_SHARD_02 --local
      - name: Comprobaciones HTTP y navegador
        run: |
          npx wrangler pages dev web/build --ip 0.0.0.0 --port 8788 > /tmp/menrut-pages.log 2>&1 &
          npx wait-on http://127.0.0.1:8788/api/v1/health
          python3 tests/http_test.py
          npm run test:browser
